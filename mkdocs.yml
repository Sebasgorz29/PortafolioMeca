site_name: Bitacora de Sebastián Gómez Rodríguez

nav:
  - Recursos:
  - Quien soy?: recursos/about.md
  - Proyectos con ESP32 y Arduino: index.md
  - Comunicación Bluetooth entre ESP32 y Celular: ESP32yCelular.md
  - Encendido del LED con Pulsador usando Arduino: EncendidodeLED.md
  - KiCad: KiCad.md
  - Control de Giro, Velocidad y Posición con ESP32: Motor.md
  - Vehículo Controlado por Bluetooth con Motores DC: Vehiculo.md
  - Balanza:
      - Balanza Stewart: balanza/BalzaStewart.md
      - Calibración C: balanza/CalibracionC.md
      - Calibración P: balanza/CalibracionP.md
      - OpenCV: balanza/Opencv.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.critic:
      mode: view
  - pymdownx.caret
  - pymdownx.keys
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - admonition
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
# Use the ReadTheDocs theme
theme:
  name: material
  highlightjs: true 
  palette:
      - scheme: default
        primary: red

  features:
    - content.code.copy
    - content.tooltips
extra_css:
  - https://use.fontawesome.com/releases/v6.5.2/css/all.css
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css

